<div class="scene" data-scene>
    <div class="scene-head">
        <strong>Cena <span class="scene-n">{{ scene.ordem|default:1 }}</span></strong>
        <button type="button" class="btn btn-ghost btn-sm" data-remove-scene>
            {% include 'partials/icon.html' with name='trash-2' %} Remover cena
        </button>
    </div>
    <div class="field">
        <label>Texto falado</label>
        <textarea name="scene_text" class="input scene-text" rows="6">{{ scene.texto }}</textarea>
    </div>
    <div class="field">
        <label>Imagem de fundo <span class="muted">(opcional)</span></label>
        <input type="text" name="scene_image" class="input" list="image-names" value="{{ scene.imagem }}"
               placeholder="nome-do-arquivo.png" autocomplete="off">
        {% if scene.problema %}<span class="scene-problem">{% include 'partials/icon.html' with name='alert-triangle' %} {{ scene.problema }}</span>{% endif %}
    </div>
</div>
