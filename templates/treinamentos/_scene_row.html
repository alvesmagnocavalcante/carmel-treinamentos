<div class="scene" data-scene>
    <div class="scene-head">
        <strong>Cena <span class="scene-n">{{ scene.ordem|default:1 }}</span></strong>
        <button type="button" class="btn btn-ghost btn-sm" data-remove-scene>
            {% include 'partials/icon.html' with name='trash-2' %} Remover cena
        </button>
    </div>
    <div class="field">
        <label>Texto falado</label>
        <textarea name="scene_text" class="input scene-text" rows="6">{{ scene.texto }}</textarea>
    </div>
    <div class="field">
        <label>Imagem em tela cheia <span class="muted">(opcional, sem o avatar)</span></label>
        <input type="text" name="scene_image" class="input" list="image-names" value="{{ scene.imagem }}"
               placeholder="nome-do-arquivo.png" autocomplete="off">
        <div class="scene-animate">
            <select name="scene_animar" class="input" aria-label="Movimento da imagem">
                <option value="0" {% if not scene.animar %}selected{% endif %}>Imagem parada</option>
                <option value="1" {% if scene.animar %}selected{% endif %}>Animar a imagem (IA)</option>
            </select>
            <input type="text" name="scene_movimento" class="input" value="{{ scene.movimento }}" maxlength="500"
                   placeholder="Como animar (opcional): ex. aproximação lenta da câmera" autocomplete="off"
                   {% if not scene.animar %}hidden{% endif %}>
        </div>
        {% if scene.problema %}<span class="scene-problem">{% include 'partials/icon.html' with name='alert-triangle' %} {{ scene.problema }}</span>{% endif %}
        {% if scene.aviso and not scene.problema %}<span class="scene-notice">{% include 'partials/icon.html' with name='info' %} {{ scene.aviso }}</span>{% endif %}
    </div>
</div>
